<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBFAF7" />
    <meta
      name="description"
      content="NyAIy reads Indian legal documents and explains the risky clauses, the law that applies and what to ask for. Informational only, not legal advice."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>NyAIy — your legal copilot</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Static first paint; React replaces this as soon as it loads. -->
      <div id="shell" class="flex min-h-dvh flex-col">
        <header class="border-b border-line bg-paper">
          <div class="mx-auto flex h-14 max-w-6xl items-center px-4 sm:px-6">
            <span class="font-serif text-xl font-semibold tracking-tight text-accent">NyAIy</span>
          </div>
        </header>
        <main class="mx-auto w-full max-w-3xl px-4 pb-20 pt-10 sm:px-6 sm:pt-20">
          <h1 class="max-w-2xl font-serif text-[2rem] font-semibold leading-[1.15] tracking-tight sm:text-5xl sm:leading-[1.1]">
            Understand a legal document before you sign it.
          </h1>
          <p class="mt-4 max-w-xl text-base leading-relaxed text-muted sm:mt-5 sm:text-lg">
            Add a contract, notice or judgment. NyAIy reads it against Indian law, flags the clauses to question and answers your follow-up questions.
          </p>
        </main>
      </div>
      <script>
        try {
          if (localStorage.getItem('nyaiy.lang') === 'hi') document.getElementById('shell').remove();
        } catch (e) {}
      </script>
    </div>
  </body>
</html>
